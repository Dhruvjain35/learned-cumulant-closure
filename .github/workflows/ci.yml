name: CI

# Import smoke test: proves a fresh clone installs and the reorganized flat-import
# layout still loads every load-bearing module. It does NOT run simulations (those
# need exact QuTiP solves that are too slow for CI); scientific results are frozen
# and validated in the repository, not re-derived here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke test
        run: make test
