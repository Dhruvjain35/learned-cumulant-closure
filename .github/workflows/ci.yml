name: CI

# Two checks. The import smoke test proves a fresh clone installs and the reorganized
# flat-import layout still loads every load-bearing module. The derivation gates then
# re-verify the model conventions against closed-form results and the second-order
# equations of motion against an exactness identity, on every commit, in under a minute.
#
# CI does NOT re-derive the scientific results: those need exact QuTiP solves far too
# slow for a runner. They are frozen, logged, and provenance-tracked in the repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke test
        run: make test

      - name: Derivation gates (conventions + EOM identity)
        run: make gates

      - name: Portable V7 equivalence (portable_v7/ vs frozen pickles)
        run: make portable-test
